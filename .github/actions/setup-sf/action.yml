name: Setup Salesforce tooling
description: Instala Node, Java, dependencias npm y Salesforce CLI.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Instalar dependencias npm
      shell: bash
      run: npm ci

    - name: Instalar Salesforce CLI
      shell: bash
      run: |
        npm install --global @salesforce/cli
        sf --version

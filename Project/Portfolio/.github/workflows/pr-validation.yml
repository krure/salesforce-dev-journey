name: PR Validation

on:
  pull_request:
    branches: [develop, main]

# Un solo run por PR: si llega un push nuevo, se cancela el anterior.
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1) Calidad estática: formato, pruebas Jest y Code Analyzer. No necesita org.
  # ───────────────────────────────────────────────────────────────────────────
  quality:
    name: Calidad de código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-sf

      - name: Verificar formato (Prettier)
        run: npm run prettier:verify

      - name: Pruebas unitarias LWC (Jest)
        run: npm run test:unit:coverage

      - name: Salesforce Code Analyzer
        run: |
          sf plugins install code-analyzer
          sf code-analyzer run \
            --workspace force-app \
            --rule-selector Recommended \
            --severity-threshold 2 \
            --output-file code-analyzer-results.html

      - name: Subir reporte de Code Analyzer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-analyzer-results
          path: code-analyzer-results.html
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  # 2) Validación real: scratch org efímera, despliegue completo y pruebas Apex.
  # ───────────────────────────────────────────────────────────────────────────
  scratch-validation:
    name: Validar en scratch org
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Secretos del Dev Hub, definidos en Settings > Environments > devhub
    environment: devhub
    env:
      SCRATCH_ALIAS: ci-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-sf

      - name: Login al Dev Hub
        uses: ./.github/actions/sf-login
        with:
          consumer-key: ${{ secrets.SF_CONSUMER_KEY }}
          username: ${{ secrets.SF_USERNAME }}
          jwt-key: ${{ secrets.SF_JWT_KEY }}
          instance-url: ${{ vars.SF_INSTANCE_URL || 'https://login.salesforce.com' }}
          alias: devhub
          set-default-dev-hub: 'true'

      - name: Crear scratch org (1 día de vida)
        run: |
          sf org create scratch \
            --definition-file config/project-scratch-def.json \
            --alias "$SCRATCH_ALIAS" \
            --duration-days 1 \
            --target-dev-hub devhub \
            --set-default \
            --wait 15

      - name: Desplegar código fuente
        run: sf project deploy start --source-dir force-app --target-org "$SCRATCH_ALIAS" --wait 30

      - name: Asignar permission set y cargar datos semilla
        run: |
          sf org assign permset --name MassUserCreator_Admin --target-org "$SCRATCH_ALIAS"
          sf apex run --file scripts/apex/seed-data.apex --target-org "$SCRATCH_ALIAS"

      - name: Ejecutar pruebas Apex
        run: |
          mkdir -p test-results
          sf apex run test \
            --target-org "$SCRATCH_ALIAS" \
            --test-level RunLocalTests \
            --code-coverage \
            --result-format human \
            --output-dir test-results \
            --wait 30

      - name: Subir resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-test-results-pr-${{ github.event.pull_request.number }}
          path: test-results
          if-no-files-found: ignore

      # always() también corre si el workflow se cancela, para no dejar scratch orgs huérfanas.
      - name: Eliminar scratch org
        if: always()
        run: sf org delete scratch --target-org "$SCRATCH_ALIAS" --no-prompt || true
